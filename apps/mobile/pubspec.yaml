name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  google_sign_in: ^7.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - lib/assets/icons/app_icon.png
    - lib/assets/icons/google_sign_in/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icons/app_icon_dark.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#101918"
  image: "lib/assets/icons/splash_logo.png"

  android: true
  ios: true
  web: false

  android_12:
    color: "#101918"
    image: "lib/assets/icons/splash_logo.png"